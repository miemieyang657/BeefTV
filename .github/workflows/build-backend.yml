name: Build BeefTV Backend (Linux ARM64)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go (latest stable)
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Show Go version
        run: go version

      - name: Download dependencies
        working-directory: backend
        run: |
          export GOTOOLCHAIN=auto
          go mod download

      - name: Install ARM64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          aarch64-linux-gnu-gcc --version

      - name: Build backend server (Linux ARM64 with CGO)
        working-directory: backend
        run: |
          export GOTOOLCHAIN=auto
          CC=aarch64-linux-gnu-gcc \
          CGO_ENABLED=1 \
          GOOS=linux \
          GOARCH=arm64 \
          go build -trimpath -ldflags="-s -w" -o beeftv-server-linux-arm64 ./cmd/server

      - name: Verify binary
        working-directory: backend
        run: |
          ls -lh beeftv-server-linux-arm64
          file beeftv-server-linux-arm64

      - name: Smoke test (run help/version, should not crash)
        working-directory: backend
        run: |
          # Linux runner x86 无法直接运行 arm64 二进制，这里只检查文件是否生成
          test -x beeftv-server-linux-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: beeftv-backend-linux-arm64
          path: backend/beeftv-server-linux-arm64
          retention-days: 30
