name: Build BeefTV Backend (Linux ARM64)

on:
  workflow_dispatch:

jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'  # 明确指定 1.25.0
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        working-directory: backend
        run: |
          go mod download

      - name: Build backend server (Linux ARM64)
        working-directory: backend
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o beeftv-server-linux-arm64 ./cmd/server

      - name: Verify binary
        run: |
          ls -lh backend/beeftv-server-linux-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: beeftv-backend-linux-arm64
          path: backend/beeftv-server-linux-arm64
          retention-days: 30
